version: '3.8'

services:
  app:
    image: distroflow-app
    build:
      context: ./laravel-backend
      dockerfile: Dockerfile
    container_name: distroflow-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=distroflow
      - DB_USERNAME=distroflow
      - DB_PASSWORD=secret
    volumes:
      - ./laravel-backend:/var/www/html
    depends_on:
      - db
    networks:
      - distroflow-network

  db:
    image: mysql:8.0
    container_name: distroflow-db
    restart: unless-stopped
    environment:
      - MYSQL_DATABASE=distroflow
      - MYSQL_USER=distroflow
      - MYSQL_PASSWORD=secret
      - MYSQL_ROOT_PASSWORD=rootsecret
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - distroflow-network

  frontend:
    image: node:18-alpine
    container_name: distroflow-frontend
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./react-frontend:/app
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    networks:
      - distroflow-network

  driver-pwa:
    image: node:18-alpine
    container_name: distroflow-driver
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./driver-pwa:/app
    ports:
      - "5174:5174"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    networks:
      - distroflow-network

volumes:
  db_data:

networks:
  distroflow-network:
    driver: bridge
